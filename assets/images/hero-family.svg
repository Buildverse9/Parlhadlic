<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" rx="20" fill="url(#skyGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="100" cy="80" r="120" fill="#DBEAFE" opacity="0.4"/>
  <circle cx="520" cy="120" r="80" fill="#FEF3C7" opacity="0.6"/>

  <!-- Giant Protective Golden Umbrella / Canopy -->
  <path d="M 120,180 C 120,60 480,60 480,180 C 420,165 360,165 300,165 C 240,165 180,165 120,180 Z" 
        fill="url(#shieldGrad)" filter="url(#softShadow)"/>
  <!-- Umbrella Highlights & Ribs -->
  <path d="M 300,75 L 300,165" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
  <path d="M 300,75 C 240,95 210,135 190,172" stroke="#FDE68A" stroke-width="2" fill="none"/>
  <path d="M 300,75 C 360,95 390,135 410,172" stroke="#FDE68A" stroke-width="2" fill="none"/>
  <!-- Umbrella Top Tip -->
  <circle cx="300" cy="73" r="8" fill="#FDE68A"/>
  
  <!-- Umbrella Handle Shaft -->
  <path d="M 300,165 L 300,380 C 300,400 280,410 265,395" stroke="#92400E" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Family Group Protected Underneath -->
  <!-- Father -->
  <g transform="translate(200, 210)">
    <!-- Head -->
    <circle cx="25" cy="25" r="22" fill="#D97706"/>
    <!-- Hair -->
    <path d="M 10,20 C 10,8 40,8 40,20 Z" fill="#1E293B"/>
    <!-- Torso (Navy Blue Shirt) -->
    <path d="M 5,50 C 5,42 45,42 45,50 L 50,150 L 0,150 Z" fill="#1E3A8A"/>
    <!-- Smiling details -->
    <circle cx="32" cy="24" r="3" fill="#FFF"/>
  </g>

  <!-- Mother -->
  <g transform="translate(350, 220)">
    <!-- Head -->
    <circle cx="22" cy="22" r="20" fill="#D97706"/>
    <!-- Hair -->
    <path d="M 2,24 C 2,5 42,5 42,24 C 42,35 35,40 22,40 Z" fill="#1E293B"/>
    <!-- Torso (Festive Green/Maroon Saree) -->
    <path d="M 5,46 C 5,38 39,38 39,46 L 45,140 L -2,140 Z" fill="#047857"/>
    <path d="M 7,46 Q 30,90 44,140" stroke="#F59E0B" stroke-width="4" fill="none"/>
  </g>

  <!-- Child / Daughter in the middle -->
  <g transform="translate(270, 275)">
    <!-- Head -->
    <circle cx="20" cy="18" r="16" fill="#F59E0B"/>
    <!-- Hair Ponytails -->
    <circle cx="5" cy="12" r="6" fill="#1E293B"/>
    <circle cx="35" cy="12" r="6" fill="#1E293B"/>
    <path d="M 8,16 C 8,6 32,6 32,16 Z" fill="#1E293B"/>
    <!-- Torso (Bright Yellow Dress) -->
    <path d="M 8,36 C 8,32 32,32 32,36 L 40,90 L 0,90 Z" fill="#FBBF24"/>
    <!-- Raised hands (Celebration) -->
    <path d="M 8,42 L -8,25" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 32,42 L 48,25" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Floating Floating Badges (Guaranteed, Tax Free, Claim Ratio) -->
  <g transform="translate(60, 230)" filter="url(#softShadow)">
    <rect width="115" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="26" r="14" fill="#ECFDF5"/>
    <text x="24" y="31" text-anchor="middle" font-size="14" fill="#059669">✓</text>
    <text x="46" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">100% Tax Free</text>
    <text x="46" y="38" font-family="sans-serif" font-size="9" fill="#64748B">Sec 10(10D)</text>
  </g>

  <g transform="translate(425, 230)" filter="url(#softShadow)">
    <rect width="125" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="26" r="14" fill="#FEF3C7"/>
    <text x="24" y="31" text-anchor="middle" font-size="14" fill="#D97706">★</text>
    <text x="46" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Sovereign Safety</text>
    <text x="46" y="38" font-family="sans-serif" font-size="9" fill="#64748B">Sec 37 LIC Act</text>
  </g>

  <g transform="translate(240, 385)" filter="url(#softShadow)">
    <rect width="140" height="42" rx="21" fill="url(#accentBlue)"/>
    <text x="70" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">
      98.5%+ Claims Settled
    </text>
  </g>
</svg>
