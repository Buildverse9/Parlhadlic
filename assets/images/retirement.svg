<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="500" height="380" rx="16" fill="url(#warmBg)"/>

  <!-- Golden Rising/Setting Sun (Peaceful Retirement) -->
  <circle cx="250" cy="170" r="85" fill="url(#sunGrad)" opacity="0.8"/>
  <path d="M 0,260 Q 250,220 500,260 L 500,380 L 0,380 Z" fill="#047857"/>
  <path d="M 0,280 Q 250,250 500,280 L 500,380 L 0,380 Z" fill="#065F46"/>

  <!-- Relaxing Lounge Chairs & Umbrella on Meadow -->
  <!-- Easy Chair -->
  <g transform="translate(160, 200)">
    <!-- Slanted Canvas Chair -->
    <line x1="20" y1="75" x2="70" y2="25" stroke="#92400E" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="35" x2="75" y2="75" stroke="#92400E" stroke-width="6" stroke-linecap="round"/>
    <path d="M 28,38 Q 45,65 65,30" stroke="#DC2626" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tea Table with Coffee Mug & Newspaper -->
  <g transform="translate(260, 220)">
    <!-- Table -->
    <rect x="0" y="30" width="60" height="6" rx="3" fill="#B45309"/>
    <line x1="12" y1="36" x2="8" y2="60" stroke="#78350F" stroke-width="4"/>
    <line x1="48" y1="36" x2="52" y2="60" stroke="#78350F" stroke-width="4"/>
    <!-- Mug -->
    <rect x="22" y="16" width="14" height="14" rx="2" fill="#FFFFFF"/>
    <path d="M 36,19 C 41,19 41,27 36,27" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <!-- Steam -->
    <path d="M 26,12 Q 28,6 26,0" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 32,12 Q 34,6 32,0" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- Calendar showing "1st of Every Month - Pension Credited" -->
  <g transform="translate(340, 80)">
    <rect width="110" height="95" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect width="110" height="28" rx="8" fill="#1E3A8A"/>
    <text x="55" y="19" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">MONTHLY PENSION</text>
    <text x="55" y="65" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#047857">₹50K+</text>
    <text x="55" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#64748B">GUARANTEED FOR LIFE</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="80" y="325" width="340" height="38" rx="19" fill="#0A2540"/>
  <text x="250" y="349" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FDE047" letter-spacing="0.5">
    Lifelong Guaranteed Pension with Return of Capital
  </text>
</svg>
