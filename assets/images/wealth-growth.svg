<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="500" height="380" rx="16" fill="url(#emeraldBg)"/>

  <!-- Compounding Upward Growth Trend Arc -->
  <path d="M 60,300 Q 200,280 280,180 T 420,70" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Trend Arrow -->
  <polygon points="420,70 405,85 425,95" fill="#059669"/>

  <!-- Growing Stacks of Gold Coins -->
  <!-- Stack 1 (Small) -->
  <g transform="translate(100, 260)">
    <ellipse cx="25" cy="40" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="25" cy="30" rx="25" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="25" cy="20" rx="25" ry="8" fill="url(#coinGrad)"/>
    <text x="25" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350F">₹</text>
  </g>

  <!-- Stack 2 (Medium) -->
  <g transform="translate(210, 210)">
    <ellipse cx="28" cy="80" rx="28" ry="9" fill="url(#coinGrad)"/>
    <ellipse cx="28" cy="68" rx="28" ry="9" fill="url(#coinGrad)"/>
    <ellipse cx="28" cy="56" rx="28" ry="9" fill="url(#coinGrad)"/>
    <ellipse cx="28" cy="44" rx="28" ry="9" fill="url(#coinGrad)"/>
    <ellipse cx="28" cy="32" rx="28" ry="9" fill="url(#coinGrad)"/>
    <ellipse cx="28" cy="20" rx="28" ry="9" fill="url(#coinGrad)"/>
    <text x="28" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350F">₹</text>
  </g>

  <!-- Stack 3 (Large) -->
  <g transform="translate(330, 140)">
    <ellipse cx="32" cy="140" rx="32" ry="10" fill="url(#coinGrad)"/>
    <ellipse cx="32" cy="125" rx="32" ry="10" fill="url(#coinGrad)"/>
    <ellipse cx="32" cy="110" rx="32" ry="10" fill="url(#coinGrad)"/>
    <ellipse cx="32" cy="95" rx="32" ry="10" fill="url(#coinGrad)"/>
    <ellipse cx="32" cy="80" rx="32" ry="10" fill="url(#coinGrad)"/>
    <ellipse cx="32" cy="65" rx="32" ry="10" fill="url(#coinGrad)"/>
    <ellipse cx="32" cy="50" rx="32" ry="10" fill="url(#coinGrad)"/>
    <ellipse cx="32" cy="35" rx="32" ry="10" fill="url(#coinGrad)"/>
    <ellipse cx="32" cy="20" rx="32" ry="10" fill="url(#coinGrad)"/>
    <text x="32" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350F">₹</text>
  </g>

  <!-- Multiplier Badge Floating -->
  <g transform="translate(290, 45)">
    <rect width="130" height="42" rx="21" fill="#059669"/>
    <text x="65" y="26" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">
      2.5x - 3.2x Wealth
    </text>
  </g>

  <!-- Bottom Banner -->
  <rect x="80" y="325" width="340" height="38" rx="19" fill="#047857"/>
  <text x="250" y="349" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
    Tax-Free Compounding with Reversionary Bonuses
  </text>
</svg>
