<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#855806" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#001830" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M 200,20 C 310,20 370,50 370,160 C 370,280 250,350 200,380 C 150,350 30,280 30,160 C 30,50 90,20 200,20 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)" stroke="#FFE89C" stroke-width="4"/>

  <!-- Inner Blue Shield -->
  <path d="M 200,35 C 295,35 345,62 345,160 C 345,265 240,330 200,358 C 160,330 55,265 55,160 C 55,62 105,35 200,35 Z" 
        fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Protective Hands / Rays Motif -->
  <g transform="translate(200, 150) scale(0.9)">
    <!-- Central Lamp Flame (Jyoti - LIC Symbol) -->
    <path d="M 0,-60 C 25,-25 30,10 0,35 C -30,10 -25,-25 0,-60 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <ellipse cx="0" cy="5" rx="10" ry="18" fill="#FFFBE6"/>
    
    <!-- Stylized Hands clasping the flame -->
    <path d="M -55,30 C -45,10 -25,20 0,40 C 25,20 45,10 55,30 C 45,55 15,65 0,65 C -15,65 -45,55 -55,30 Z" fill="url(#goldGrad)"/>
    
    <!-- Protective Ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Circular Text / Badges -->
  <text x="200" y="270" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFF" letter-spacing="3">
    GOVERNMENT OF INDIA
  </text>
  <text x="200" y="295" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FBBF24" letter-spacing="2">
    SOVEREIGN GUARANTEE
  </text>
  <rect x="110" y="308" width="180" height="26" rx="13" fill="url(#goldGrad)"/>
  <text x="200" y="326" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#0A2540" letter-spacing="1">
    SECTION 37 • LIC ACT 1956
  </text>
</svg>
