<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="500" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Stack of Books -->
  <g transform="translate(140, 240)">
    <!-- Book 1 (Bottom) -->
    <rect x="0" y="50" width="220" height="30" rx="4" fill="#1E3A8A"/>
    <rect x="15" y="55" width="200" height="20" rx="2" fill="#FFFFFF"/>
    <!-- Book 2 (Middle) -->
    <rect x="15" y="22" width="190" height="28" rx="4" fill="#047857"/>
    <rect x="25" y="26" width="175" height="18" rx="2" fill="#FFFFFF"/>
    <!-- Book 3 (Top) -->
    <rect x="35" y="-3" width="150" height="25" rx="4" fill="#B45309"/>
    <rect x="45" y="1" width="135" height="17" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Big Graduation Mortarboard Cap -->
  <g transform="translate(250, 140)">
    <!-- Diamond Cap Top -->
    <polygon points="0,-45 110,-10 0,25 -110,-10" fill="#0F172A"/>
    <polygon points="0,-45 105,-10 0,20 -105,-10" fill="#1E293B"/>
    <!-- Cap Skull Base -->
    <path d="M -60,0 C -60,35 60,35 60,0 Z" fill="#0F172A"/>
    <!-- Gold Button & Tassel -->
    <circle cx="0" cy="-10" r="7" fill="url(#gradGold)"/>
    <path d="M 0,-10 Q 75,-5 85,35" stroke="url(#gradGold)" stroke-width="4" fill="none"/>
    <polygon points="85,35 78,55 92,55" fill="url(#gradGold)"/>
  </g>

  <!-- Floating Degree Certificate / Ribbon -->
  <g transform="translate(70, 90)">
    <rect width="90" height="65" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <line x1="15" y1="20" x2="75" y2="20" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="32" x2="60" y2="32" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="44" x2="50" y2="44" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold Stamp Badge -->
    <circle cx="70" cy="45" r="10" fill="#F59E0B"/>
    <polygon points="70,55 65,65 75,65" fill="#DC2626"/>
  </g>

  <!-- Financial Security Shield badge -->
  <g transform="translate(350, 80)">
    <circle cx="35" cy="35" r="35" fill="#FEF3C7"/>
    <circle cx="35" cy="35" r="28" fill="#F59E0B"/>
    <text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFF">₹</text>
  </g>

  <!-- Banner at the base -->
  <rect x="80" y="325" width="340" height="38" rx="19" fill="#1E3A8A"/>
  <text x="250" y="349" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
    Guaranteed Higher Education & Marriage Fund
  </text>
</svg>
